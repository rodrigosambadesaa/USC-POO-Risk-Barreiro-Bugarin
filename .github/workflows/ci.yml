name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Maven verify (UTF-8)
        run: mvn -B -Dfile.encoding=UTF-8 clean verify
      - name: Publish coverage report
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime image
        run: docker build --target runtime --tag usc-risk:ci .
      - name: CLI smoke test
        run: |
          mkdir -p docker-output
          docker run --rm -v "$PWD/docker-output:/app/output" usc-risk:ci
          grep -q '^EOF$' docker-output/resultados.txt
      - name: Verify test service
        run: docker compose run --rm test
      - name: Build web GUI image
        run: docker build --target gui --tag usc-risk-gui:ci .
      - name: Web GUI smoke test
        shell: bash
        run: |
          docker run --detach --name risk-gui --publish 6080:6080 usc-risk-gui:ci
          trap 'docker logs risk-gui; docker rm --force risk-gui' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6080/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1
